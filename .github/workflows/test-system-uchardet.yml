name: Test (system uchardet)

# Exercises the `system-uchardet` feature option (see meson.options): build
# cChardet against a system uchardet built from git and confirm the resulting
# extension links the shared library instead of the bundled sources. The
# regular Tests workflow only covers the bundled default.
on:
  pull_request:
  push:
    branches:
      - master

# Least-privilege GITHUB_TOKEN: this workflow only checks out and builds the
# repository, so read access to its contents is all it needs.
permissions:
  contents: read

jobs:
  system-uchardet:
    name: Build against system uchardet (from git)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # meson's files() validates the vendored uchardet sources exist at
          # configure time even for a system build, so the submodule still has
          # to be checked out.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and install uchardet from git
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config
          git clone --depth 1 \
            https://gitlab.freedesktop.org/uchardet/uchardet.git /tmp/uchardet-src
          cmake -S /tmp/uchardet-src -B /tmp/uchardet-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_BINARY=OFF
          sudo cmake --build /tmp/uchardet-build --target install
          sudo ldconfig

      - name: Confirm the system uchardet exposes the candidate API
        run: |
          pkg-config --exists uchardet
          echo "system uchardet version: $(pkg-config --modversion uchardet)"
          # `enabled`/`auto` reject a uchardet without this symbol; the last
          # tagged release still reports 0.0.8 but only the git build ships it.
          grep -q uchardet_get_n_candidates /usr/include/uchardet/uchardet.h

      - name: Build cChardet against the system uchardet
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install . \
            --config-settings=setup-args=-Dsystem-uchardet=enabled

      - name: Verify the extension links the system libuchardet
        run: |
          so=$(python -c "import cchardet._cchardet as m; print(m.__file__)")
          echo "built extension: $so"
          ldd "$so"
          # Fail if it did not link the shared system library -- i.e. it
          # silently fell back to compiling the bundled sources.
          ldd "$so" | grep -q libuchardet

      - name: Run tests
        run: python -m pytest src/tests

      # The test suite passes against a system uchardet even though detection
      # is materially worse, because it asserts labels on small samples rather
      # than error rates over a corpus. A system build links upstream's
      # nsMBCSGroupProber, so the encoding-only overlay is absent and non-UTF-8
      # input can be reported as UTF-8 -- the defect v3.0.0 was yanked for.
      #
      # This gate measures that directly. It is EXPECTED TO FAIL against an
      # unpatched upstream uchardet (~16% mislabelled), and that is the point:
      # the system-uchardet option must not be advertised as equivalent to the
      # bundled build until upstream rejects invalid UTF-8 itself. Once it
      # does, this passes and the meson probe can gate on a version constraint
      # instead of has_function().
      - name: Detection quality against the system uchardet
        run: |
          python benchmarks/make_nonutf8_corpus.py nonutf8.pkl
          python benchmarks/bench.py run --supervise nonutf8.pkl \
            --runs 3 --label system --output system.json
          # bench.py compare expects a current result plus exactly two release
          # results, so assert on the measurement directly rather than reshape
          # the harness the release benchmark depends on.
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, sys

          CEILING = 0.02
          r = json.load(open("system.json"))
          rate = r["utf8_mislabel_rate"]
          ok = rate <= CEILING

          print("## Detection quality (system uchardet)\n")
          print("| Metric | Value |")
          print("|---|---:|")
          print(f"| Documents | {r['documents']} |")
          print(f"| Throughput | {r['megabytes_per_second']:.2f} MB/s |")
          print(f"| Accuracy | {r.get('accuracy', 0):.1%} |")
          print(f"| Non-UTF-8 reported as UTF-8 | {rate:.1%} |")
          print(f"\nCeiling {CEILING:.0%} -- **{'PASS' if ok else 'FAIL'}**.")
          if not ok:
              print(
                  "\nThe system uchardet reports non-UTF-8 input as UTF-8. "
                  "This is the defect v3.0.0 was yanked for; the bundled build "
                  "scores 0% on identical input. See PR #64."
              )
          sys.exit(0 if ok else 1)
          PY
