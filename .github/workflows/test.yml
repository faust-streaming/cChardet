name: Tests

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 was dropped; 3.13 and 3.14 are required to pass.
        # The `t` entries are the free-threaded (no-GIL) builds. They are the
        # only coverage for the freethreading_compatible declaration -- without
        # them a regression is invisible until someone imports cchardet on a
        # free-threaded interpreter. Note cibuildwheel 4.1.0 cannot build
        # cp313t wheels at all, so 3.13t is tested here or nowhere.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.13t', '3.14t']

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored uchardet submodule; the meson build needs its
          # C++ sources. (checkout's `submodules` input only accepts
          # true/recursive/false -- a path is treated as false.)
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Build/install from source (meson-python pulls the build toolchain,
          # including ninja and cython, via build isolation).
          python -m pip install .

      # Deliberately no PYTHON_GIL=0 / -Xgil=0 here: those force the GIL off
      # regardless of what the extension declares, which would hide exactly the
      # regression the free-threaded rows exist to catch. The suite asserts on
      # sys._is_gil_enabled() instead (src/tests/test_free_threading.py).
      - name: Run tests
        run: python -m pytest src/tests
